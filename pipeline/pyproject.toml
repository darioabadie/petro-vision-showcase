[project]
name = "pvm-pipeline"
version = "0.1.0"
description = "Pipeline ETL Pulso Vaca Muerta: ingesta, análisis y export de releases"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "clickhouse-connect>=0.8",
    "jsonschema>=4.20",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "dbt-core>=1.9",
    "dbt-clickhouse>=1.9",
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"